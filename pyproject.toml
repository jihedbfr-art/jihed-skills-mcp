[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jihed-skills-mcp"
version = "0.1.0"
description = "MCP server that serves the ai-skills engineering skill library to autonomous agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jihed Ben Arfa", email = "302788711+jihedbfr-art@users.noreply.github.com" }
]
dependencies = [
    # MCP 2.x renamed FastMCP to MCPServer; this server targets the 2.x API.
    "mcp>=2.0.0",
    "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/jihedbfr-art/jihed-skills-mcp"
"Skill library" = "https://github.com/jihedbfr-art/ai-skills"

[project.scripts]
jihed-skills-mcp = "jihed_skills_mcp.server:main"
