[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jihed-skills-mcp"
version = "0.1.0"
description = "MCP Server for dynamic retrieval of JihedAiLabs Agent-Ready Engineering Skills."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jihed Ben Arfa", email = "contact@jihedailabs.dev" }
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1"
]

[project.scripts]
jihed-skills-mcp = "jihed_skills_mcp.server:main"
